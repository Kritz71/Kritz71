name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure target directory exists
        run: mkdir -p profile

      - name: Generate stats card
        uses: anuraghazra/github-readme-stats@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=F7F2E7&title_color=405A40&icon_color=78936A&text_color=514A3E
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages card
        uses: anuraghazra/github-readme-stats@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=F7F2E7&title_color=405A40&text_color=514A3E
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile statistics" || exit 0
          git push
